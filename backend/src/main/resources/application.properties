spring.application.name=smartstock-backend
server.port=${PORT:8080}

spring.datasource.url=${SMARTSTOCK_DB_URL:jdbc:postgresql://localhost:5432/smartstock}
spring.datasource.username=${SMARTSTOCK_DB_USERNAME:smartstock}
spring.datasource.password=${SMARTSTOCK_DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.flyway.enabled=true
spring.h2.console.enabled=false

app.cors.allowed-origins=${FRONTEND_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
app.market-data.alpha-vantage.api-key=${SMARTSTOCK_MARKET_DATA_API_KEY:}
